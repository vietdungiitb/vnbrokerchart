<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="<%= htmlWebpackPlugin.options.description %>">
    <meta name="theme-color" content="<%= htmlWebpackPlugin.options.themeColor %>">
    <meta name="application-name" content="<%= htmlWebpackPlugin.options.shortName %>">
    <meta name="author" content="<%= htmlWebpackPlugin.options.author %>">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <style>
        html, body, #root { height: 100%; overflow: hidden; }
        body {
            margin: 0;
            padding: 0;
            background: <%= htmlWebpackPlugin.options.backgroundColor %>;
            color: #e2e8f0;
            font-family: "Segoe UI Variable Text", "Aptos", "Segoe UI", sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
